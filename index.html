<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1.3 位置变化快慢的描述——速度 · 可交互课件</title>
<style>
  :root{
    /* 配色基准：原版 Manim —— 纯黑底 + 白线为主 + Manim 官方色常量
       红=位移 Δx  蓝=时间 Δt  黄=速度 v（本课主角量）  绿/紫=对照路径与辅助  一屏彩色 ≤3 */
    --bg:#000000; --bg2:#0a0a0a; --panel:#0e0e0e; --line:#242424; --line2:#383838;
    --ink:#FFFFFF; --ink2:#B0B0B0; --muted:#888888;
    --red:#FC6255; --blue:#58C4DD; --yellow:#FFFF00; --gold:#F0AC5F;
    --green:#83C167; --purple:#9A72AC; --teal:#5CD0B3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;
    overflow:hidden;
  }
  .app{display:grid; grid-template-rows:auto auto 1fr auto auto; height:100vh;}

  /* ---------- 顶栏 ---------- */
  header{display:flex; align-items:baseline; gap:14px; padding:10px 18px 8px; flex-wrap:wrap; row-gap:3px;
    background:var(--bg2); border-bottom:1px solid var(--line);}
  header h1{font-size:16px; margin:0; font-weight:600; letter-spacing:.5px; white-space:nowrap;}
  .act{font-size:13px; color:var(--yellow); border:1px solid var(--line2); border-radius:10px;
    padding:1px 9px; white-space:nowrap;}
  .steptitle{font-size:15px; color:var(--ink); font-weight:600;}
  .stepsn{margin-left:auto; font-size:13px; color:var(--ink2); font-variant-numeric:tabular-nums;}

  /* ---------- 顶部步骤导航条（按幕分组） ---------- */
  .topnav{display:flex; align-items:center; gap:5px; padding:5px 14px 6px;
    background:var(--bg2); border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden;}
  .topnav .grouplab{flex:0 0 auto; font-size:11px; letter-spacing:.6px; color:var(--muted); font-weight:600; white-space:nowrap;}
  .topnav .sep{flex:0 0 auto; width:1px; height:15px; background:var(--line2); margin:0 5px;}
  .topnav a{flex:0 0 auto; min-width:27px; height:22px; padding:0 7px; display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink2); background:#141414;
    border:1px solid var(--line2); border-radius:6px; cursor:pointer;}
  .topnav a:hover{background:#1e1e1e; color:var(--ink);}
  .topnav a.on{background:rgba(255,255,0,0.12); border-color:var(--yellow); color:var(--yellow); font-weight:700;}

  /* ---------- 主体 ---------- */
  .stage{display:grid; grid-template-columns:1fr 286px; min-height:0;}
  .canvaswrap{position:relative; min-width:0; min-height:0; padding:6px 8px 0 8px;}
  canvas{display:block; width:100%; height:100%;}
  .hint{padding:7px 20px 0 20px; font-size:12.5px; color:var(--muted); min-height:24px;}
  .hint b{color:var(--yellow); font-weight:600;}

  /* ---------- 右栏 ---------- */
  aside{background:var(--panel); border-left:1px solid var(--line); padding:10px 12px 14px; overflow-y:auto; min-height:0;}
  aside h3{font-size:12px; color:var(--muted); margin:14px 0 6px; font-weight:600; letter-spacing:.5px;}
  aside h3:first-child{margin-top:2px;}
  .rd{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:3px 0;
    font-size:12.5px; color:var(--ink2); border-bottom:1px dashed #242424;}
  .rd span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rd b{font-size:15px; color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .rd b.yellow{color:var(--yellow);} .rd b.red{color:var(--red);} .rd b.blue{color:var(--blue);}
  .rd b.green{color:var(--green);} .rd b.purple{color:var(--purple);} .rd b.grey{color:var(--muted);}
  .rd b.gold{color:var(--gold);}
  .formula{font-size:13.5px; color:var(--ink); background:#141414; border:1px solid var(--line2);
    border-radius:8px; padding:8px 10px; line-height:1.5; word-break:break-word;}
  .note{font-size:12.5px; color:var(--ink2); line-height:1.62;}
  .note b{color:var(--yellow); font-weight:600;}

  /* ---------- 底栏 ---------- */
  footer{display:flex; align-items:center; gap:8px; flex-wrap:wrap; row-gap:6px;
    padding:8px 14px 9px; background:var(--bg2); border-top:1px solid var(--line);}
  button{font-family:inherit; font-size:12.5px; color:var(--ink2); background:#141414;
    border:1px solid var(--line2); border-radius:6px; padding:5px 10px; cursor:pointer; white-space:nowrap;}
  button:hover{background:#1e1e1e; color:var(--ink);}
  button.on{background:rgba(255,255,0,0.12); border-color:var(--yellow); color:var(--yellow); font-weight:700;}
  button.main{background:#1a1a1a; color:var(--ink);}
  .bar{position:relative; flex:1 1 140px; min-width:100px; height:6px; background:#141414; border-radius:3px; cursor:pointer;}
  .bar i{display:block; height:100%; width:0; background:var(--yellow); border-radius:3px;}
  .bar u{position:absolute; top:-2px; width:1px; height:10px; background:#4a4a4a;}
  .slider{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted);}
  .slider input[type=range]{width:110px; accent-color:#4a4a4a;}
  .slider b{color:var(--ink); font-variant-numeric:tabular-nums; min-width:46px; text-align:right;}
  .grp{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .grp .lab{font-size:12.5px; color:var(--muted);}
  .hidden{display:none !important;}

  @media (max-width: 760px){
    .stage{grid-template-columns:1fr;}
    aside{border-left:none; border-top:1px solid var(--line); max-height:32vh;}
    .hint{font-size:12px;}
    header h1{font-size:14px;}
    .steptitle{font-size:13px;}
    .slider input[type=range]{width:80px;}
  }
</style>

<body>
<div class="app">
  <header>
    <h1>1.3 位置变化快慢的描述——速度</h1>
    <span class="act" id="actTag">第一幕</span>
    <span class="steptitle" id="stepTitle">—</span>
    <span class="stepsn" id="stepSn">1 / 19</span>
  </header>

  <nav class="topnav" id="toc" aria-label="步骤导航"></nav>

  <div class="stage">
    <div class="canvaswrap">
      <canvas id="cv"></canvas>
    </div>
    <aside>
      <h3>这一刻的读数</h3>
      <div id="rows"></div>

    <div class="bar" id="prog"><i></i></div>

    <div class="slider hidden" id="wrapT">
      <span>走到哪儿</span><input type="range" id="rgT" min="0" max="100" value="100"><b id="lbT">100%</b>
    </div>
    <div class="slider hidden" id="wrapSeg">
      <span>选哪一段</span><input type="range" id="rgSeg" min="0" max="5" step="1" value="0"><b id="lbSeg">第 0→1 段</b>
    </div>

      <span class="lab" id="pickLab">选择</span>
      <span id="pickBtns"></span>
    </div>

</div>

<script>
/* =====================================================================
   viz_sp_physics.js —— 1.3《位置变化快慢的描述——速度》物理内核
   纯函数 + runSelfTest()，与画面完全解耦。
   规范：/root/教学/可视化/风格与技术路线.md（第五·铁律 1/3）
   所有数据来源：教材 P21–P25、教参 P24–P29（表 1-2 原样转录）
   ===================================================================== */
(function () {
  'use strict';
  var P = {};

  /* ==========================================================
     〇、本课使用的三组"真实对象"（数据源，全部可溯源）
     ========================================================== */

  /* ① 纸带 A：教材图 1.3-2 / 1.3-3 的纸带（匀变速，每 0.02 s 一个点）
        x(t) = 0.30t + 0.30t²  →  v(t) = 0.30 + 0.60t
        用于：平均速度、瞬时速度、极限（DG/DF）、三种 Δt 选法 */
  P.TAPE_A = { name: '纸带 A（匀变速）', x0: 0, v0: 0.30, a: 0.60, T: 0.60, dtRaw: 0.02, per: 5 };

  /* ② 纸带 B：另一条手拉纸带（变速，越拉越慢地加速）
        v(t) = 0.30 + 1.20t − 0.75t²  →  x(t) = 0.30t + 0.60t² − 0.25t³
        用于：表 2（每 3 个点取计数点，Δt = 0.06 s）与 v–t 图像 */
  P.TAPE_B = { name: '纸带 B（手拉）', x0: 0, b1: 0.30, b2: 0.60, b3: -0.25, T: 0.60, dtRaw: 0.02, per2: 3 };

  /* ③ 教参表 1-2（P28）：气垫导轨 + 遮光片 + 光电门，同一高度滑下
        —— 原样转录，不得改动 */
  P.TABLE12 = [
    { d: 0.300,  dt: [0.632, 0.635, 0.636], v: 0.47 },
    { d: 0.200,  dt: [0.460, 0.459, 0.458], v: 0.44 },
    { d: 0.110,  dt: [0.264, 0.263, 0.263], v: 0.42 },
    { d: 0.038,  dt: [0.094, 0.094, 0.093], v: 0.41 },
    { d: 0.024,  dt: [0.059, 0.058, 0.058], v: 0.41 },
    { d: 0.0086, dt: [0.021, 0.021, 0.021], v: 0.41 }
  ];
  /* 官方解读：遮光片宽度小于 3.8 cm 之后，平均速度都是 0.41 m/s，
     即滑块前端 P 到达 A 点的瞬时速度 = 0.41 m/s */
  P.V_A_OFFICIAL = 0.41;

  /* ==========================================================
     一、运动学：位置 / 速度 / 平均速度（纯解析）
     ========================================================== */

  /** 匀变速：x(t) = x0 + v0·t + a·t²/2 */
  P.xOf = function (m, t) { return m.x0 + m.v0 * t + 0.5 * m.a * t * t; };
  /** 匀变速：v(t) = v0 + a·t */
  P.vOf = function (m, t) { return m.v0 + m.a * t; };
  /** 一段的平均速度 v̄ = Δx/Δt（t2 ≠ t1） */
  P.vAvg = function (m, t1, t2) { return (P.xOf(m, t2) - P.xOf(m, t1)) / (t2 - t1); };
  /** 区间中点时刻 */
  P.midOf = function (t1, t2) { return 0.5 * (t1 + t2); };
  /** 平均速度与某时刻瞬时速度之差（"误差"） */
  P.vAvgErr = function (m, t1, t2, tE) { return P.vAvg(m, t1, t2) - P.vOf(m, tE); };

  /* ---- 纸带 B 的解析式（多项式，非匀变速） ---- */
  P.xOfB = function (t) { var b = P.TAPE_B; return b.b1 * t + b.b2 * t * t + b.b3 * t * t * t; };
  P.vOfB = function (t) { var b = P.TAPE_B; return b.b1 + 2 * b.b2 * t + 3 * b.b3 * t * t; };
  P.vAvgB = function (t1, t2) { return (P.xOfB(t2) - P.xOfB(t1)) / (t2 - t1); };

  /* ==========================================================
     二、遮光片 + 光电门：v̄(d) 的精确解
     滑块以 v0 通过光电门、加速度 a；遮光片宽 d。
     遮光时间 Δt 满足  v0·Δt + a·Δt²/2 = d，
     v̄ = d/Δt，消去 Δt 得解析式  v̄(d) = (√(v0²+2ad) + v0)/2。
     d = 0 时 v̄ = v0（精确）。
     ========================================================== */
  P.plateDt = function (v0, a, d) {
    var D = v0 * v0 + 2 * a * d;
    return (-v0 + Math.sqrt(D)) / a;
  };
  P.plateAvg = function (v0, a, d) {
    return (Math.sqrt(v0 * v0 + 2 * a * d) + v0) / 2;
  };
  /** 模型偏差：用一段的平均速度代表瞬时速度，先天差多少 */
  P.plateBias = function (d, v0, a) { return P.plateAvg(v0, a, d) - v0; };

  /* ---- 误差预算（示意模型，参数在右栏明写） ----
     ① 模型偏差 b(d) = v̄(d) − v0        随 d 单调增（d→0 才为 0）
     ② 测量误差 e(d) = v̄·(δd/d + δt/Δt)  随 d 单调减（d 小则相对误差大）
     总误差 E(d) = b(d) + e(d)            在内部取到极小 → "合适 ≠ 最小" */
  P.plateMeasErr = function (d, v0, a, dd, dt) {
    var vb = P.plateAvg(v0, a, d), ts = P.plateDt(v0, a, d);
    return vb * (dd / d + dt / ts);
  };
  P.plateTotalErr = function (d, v0, a, dd, dt) {
    return P.plateBias(d, v0, a) + P.plateMeasErr(d, v0, a, dd, dt);
  };
  /** 总误差极小点（黄金分割搜索，纯数值、与画面无关） */
  P.bestWidth = function (v0, a, dd, dt, lo, hi) {
    lo = (lo === undefined) ? 0.002 : lo; hi = (hi === undefined) ? 0.30 : hi;
    var g = 0.6180339887498949, x1 = hi - g * (hi - lo), x2 = lo + g * (hi - lo);
    var f1 = P.plateTotalErr(x1, v0, a, dd, dt), f2 = P.plateTotalErr(x2, v0, a, dd, dt), i;
    for (i = 0; i < 200; i++) {
      if (f1 < f2) { hi = x2; x2 = x1; f2 = f1; x1 = hi - g * (hi - lo); f1 = P.plateTotalErr(x1, v0, a, dd, dt); }
      else { lo = x1; x1 = x2; f1 = f2; x2 = lo + g * (hi - lo); f2 = P.plateTotalErr(x2, v0, a, dd, dt); }
    }
    return 0.5 * (lo + hi);
  };

  /* ==========================================================
     三、最小二乘直线拟合（截距外推用）
     ========================================================== */
  P.fitLine = function (pts) {
    var n = pts.length, sx = 0, sy = 0, sxx = 0, sxy = 0, syy = 0, i, x, y;
    for (i = 0; i < n; i++) { x = pts[i][0]; y = pts[i][1]; sx += x; sy += y; sxx += x * x; sxy += x * y; syy += y * y; }
    var dxx = n * sxx - sx * sx, dxy = n * sxy - sx * sy, dyy = n * syy - sy * sy;
    var k = dxy / dxx, b = (sy - k * sx) / n;
    var r2 = (dyy > 0) ? (dxy * dxy) / (dxx * dyy) : 1;
    return { k: k, b: b, r2: r2 };
  };
  /** 表 1-2 → [[d, v̄], …] */
  P.table12Pts = function () {
    return P.TABLE12.map(function (r) { return [r.d, r.v]; });
  };

  /* ==========================================================
     四、反例素材
     ========================================================== */
  /* 反例一：从同一地点同时出发、同时到达同一终点，一条绕远、一条走近路 */
  P.PATH_FAR = [[0, 0], [0, 4], [6, 4], [6, 2]];
  P.PATH_NEAR = [[0, 0], [6, 2]];
  P.PATH_T = 20;                         // 两条路径所用时间相同：20 s
  P.polyLen = function (pts) {
    var L = 0, i;
    for (i = 1; i < pts.length; i++) { L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); }
    return L;
  };
  /** 折线上按路程比例取点（s ∈ [0,1]） */
  P.pointOn = function (pts, s) {
    var L = P.polyLen(pts), want = Math.max(0, Math.min(1, s)) * L, acc = 0, i, seg, t;
    if (L <= 0) { return { x: pts[0][0], y: pts[0][1] }; }
    for (i = 1; i < pts.length; i++) {
      seg = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      if (acc + seg >= want) {
        t = seg > 0 ? (want - acc) / seg : 0;
        return { x: pts[i - 1][0] + t * (pts[i][0] - pts[i - 1][0]),
                 y: pts[i - 1][1] + t * (pts[i][1] - pts[i - 1][1]) };
      }
      acc += seg;
    }
    return { x: pts[pts.length - 1][0], y: pts[pts.length - 1][1] };
  };
  /* 反例二：一东一南，路程与时间之比都是 20 m/s */
  P.CAR_E = { from: [0, 0], to: [20, 0] };
  P.CAR_S = { from: [0, 0], to: [0, -20] };
  P.CAR_T = 1;                           // 都是 1 s

  /* ==========================================================
     五、速率：匀速圆周运动（速率不变、速度变）
     ========================================================== */
  P.circleP = function (R, w, t) { return { x: R * Math.cos(w * t), y: R * Math.sin(w * t) }; };
  P.circleV = function (R, w, t) { return { x: -R * w * Math.sin(w * t), y: R * w * Math.cos(w * t) }; };
  /** 一段时间内速度变化量的大小（不为 0 才说明"速度变了"） */
  P.dvMag = function (R, w, t1, t2) {
    var a = P.circleV(R, w, t1), b = P.circleV(R, w, t2);
    return Math.hypot(b.x - a.x, b.y - a.y);
  };

  /* ==========================================================
     六、"平均速度" vs "速度的平均"
     等间隔取 n 个时刻 t_k = k·T（k=1..n），匀变速：
        速度的平均 = v0 + a·T·(n+1)/2
        平均速度   = v0 + a·(n·T)/2
        两者之差恒为 a·T/2（与 n 无关）
     ========================================================== */
  P.meanOfSpeeds = function (m, T, n) {
    var s = 0, k;
    for (k = 1; k <= n; k++) { s += P.vOf(m, k * T); }
    return s / n;
  };
  P.meanOfSpeedsTheory = function (m, T, n) { return m.v0 + m.a * T * (n + 1) / 2; };

  /* ==========================================================
     七、v–t 图像：两条迷思的反例素材
     ========================================================== */
  /* 迷思一："图线在横轴下方 = 减速"。反例：v(t) = 0.60 − 1.20t（0 ≤ t ≤ 0.9），
     后半段 v < 0 —— 它是"反向运动"，而且 |v| 在变大（在加速）。 */
  P.MYTH_V = { v0: 0.60, a: -1.20 };
  P.mythV = function (t) { return P.MYTH_V.v0 + P.MYTH_V.a * t; };
  /* 迷思二："图线是曲线 = 做曲线运动"。反例：纸带 B 的 v–t 是曲线，
     但纸带只沿一条直线运动（轨迹是直线）。 */

  /* ==========================================================
     八、自检：物理专项断言（页面内跑，报出用例数与最大误差）
     ========================================================== */
  P.runSelfTest = function () {
    var cases = 0, worst = 0, bad = [];
    function chk(a, b, tag, tol) {
      cases++;
      var e = Math.abs(a - b);
      if (e > worst) { worst = e; }
      if (e > (tol === undefined ? 1e-9 : tol)) { bad.push(tag + ' err=' + e.toExponential(2)); }
    }
    function chkT(cond, tag) { cases++; if (!cond) { bad.push(tag); } }
    var A = P.TAPE_A, i, j, t1, t2, dt, tE, m;

    /* ① 匀变速·中间时刻法则：v̄[t1,t2] = v((t1+t2)/2)（代数恒等，误差应为 0） */
    var segs = [[0, 0.6], [0.1, 0.5], [0.02, 0.2], [0.24, 0.36], [0.5, 0.52], [0.06, 0.6]];
    for (i = 0; i < segs.length; i++) {
      chk(P.vAvg(A, segs[i][0], segs[i][1]), P.vOf(A, P.midOf(segs[i][0], segs[i][1])), '①中间时刻法则');
    }
    /* ② 对称区间：v̄[t−Δ/2, t+Δ/2] 精确等于 v(t)，Δ 任意 */
    var dts = [0.02, 0.04, 0.06, 0.10, 0.20];
    var ts = [0.06, 0.12, 0.30, 0.44];
    for (i = 0; i < ts.length; i++) {
      for (j = 0; j < dts.length; j++) {
        tE = ts[i]; dt = dts[j];
        if (tE - dt / 2 < 0 || tE + dt / 2 > A.T) { continue; }
        chk(P.vAvg(A, tE - dt / 2, tE + dt / 2), P.vOf(A, tE), '②对称区间=该点瞬时速度');
      }
    }
    /* ③ 不对称区间：误差恒等于 a·(中点 − tE)，Δt 再小也停在这儿 */

      chk(P.vAvgErr(A, t1, t2, tE), A.a * (P.midOf(t1, t2) - tE), '③不对称区间误差=a·(中点−tE)');

    for (i = 0; i < 6; i++) {

      txt(ctx, ad.X(0) + 10, ad.Y(-10), '位移 20 m（南）', T.red, 12.5, 'left', 600);
      dot(ctx, ad.X(pe.x), ad.Y(pe.y), 6, T.white);
      dot(ctx, ad.X(pss.x), ad.Y(pss.y), 6, T.white);
      arrow(ctx, ad.X(pe.x), ad.Y(pe.y), ad.X(pe.x), ad.Y(pe.y - 3.2), T.yellow, 2.6, 8);
      txt(ctx, ad.X(pe.x), ad.Y(pe.y) + 18, '车 A：20 m/s', T.yellow, 12.5, 'center', 600);
      arrow(ctx, ad.X(pss.x), ad.Y(pss.y) - 4, ad.X(pss.x + 3.2), ad.Y(pss.y) - 4, T.yellow, 2.6, 8);
      txt(ctx, ad.X(pss.x) + 6, ad.Y(pss.y) - 4, '车 B：20 m/s', T.yellow, 12.5, 'left', 600);
      txt(ctx, nar ? 12 : ad.left, nar ? 20 : ad.top - 2, '路程 ÷ 时间：两车都是 20 m/s', T.grey, nar ? 11.5 : 12.5, 'left');
      txt(ctx, nar ? 12 : ad.left, nar ? 40 : ad.top + 18, '位移 ÷ 时间：一东一南，是两个速度', T.yellow, nar ? 11.5 : 12.5, 'left', 600);
      return;
    }
    /* 反例一：同一地点出发、同时到达同一终点，一条绕远、一条走近路 */
    var a = fitAxis(box, -1.4, 7.6, -1.4, 5.6);
    gridAxes(ctx, a, 1, 1, 'x / m', 'y / m');
    var pfar = P.PATH_FAR.map(function (p) { return [a.X(p[0]), a.Y(p[1])]; });
    var pnear = P.PATH_NEAR.map(function (p) { return [a.X(p[0]), a.Y(p[1])]; });
    poly(ctx, pfar, T.green, 2.4);
    poly(ctx, pnear, T.purple, 2.4);
    arrow(ctx, a.X(0), a.Y(0), a.X(6), a.Y(2), T.red, 3, 11);
    dot(ctx, a.X(0) + a.Y(0) * 0, a.Y(0), 5, T.white);
    dot(ctx, a.X(6), a.Y(2), 5, T.white);
    txt(ctx, a.X(0) - 8, a.Y(0) + 16, '起点', T.white, 12, 'right');
    txt(ctx, a.X(6) + 8, a.Y(2) + 16, '终点', T.white, 12, 'left');
    txt(ctx, a.X(3.2), a.Y(1.0) - 12, '位移（红）', T.red, 12.5, 'center', 600);
    if (!nar) { txt(ctx, a.X(0) + 8, a.Y(4), '绕远的路（绿）', T.green, 12.5, 'left', 600); }
    txt(ctx, a.X(3.6), a.Y(2) + 18, '走近路（紫）', T.purple, 12.5, 'center', 600);
    var s = (st.t === undefined) ? 1 : st.t;
    var q1 = P.pointOn(P.PATH_FAR, s), q2 = P.pointOn(P.PATH_NEAR, s);
    dot(ctx, a.X(q1.x), a.Y(q1.y), 6, T.white);
    dot(ctx, a.X(q2.x), a.Y(q2.y), 6, T.white);
    txt(ctx, nar ? 12 : a.left, nar ? 20 : a.top - 2, '两车同时出发、同时到达同一个终点', T.white, nar ? 11.5 : 12.5, 'left');
    txt(ctx, nar ? 12 : a.left, nar ? 40 : a.top + 18, '路程 12.0 / 6.3 m　位移都是 6.3 m', T.grey, nar ? 11.5 : 12.5, 'left');
  }

  /* =====================================================================
     场景 2：axis —— 位置轴 + 时间轴（比值定义 / 命名 / 平均速度）
     ===================================================================== */
  function motionOf(o) {
    if (o.motion === 'uniform') { return { x0: 0, v0: 2.0, a: 0, T: 3.0 }; }
    return P.TAPE_A;
  }
  function sceneAxis(ctx, W, H, st, S) {
    var o = st.opts || {}, m = motionOf(o);
    var hMain = H * 0.52, hStrip = H * 0.24;
    var top = { x: 62, y: 34, w: W - 108, h: hMain - 34 };
    var bot = { x: 62, y: hMain + 34, w: W - 108, h: hStrip - 30 };
    var aX = mkAxis(top.x, top.y, top.x + top.w, top.y + top.h, m.x0, P.xOf(m, m.T), -0.6, 0.6);
    var aT = mkAxis(bot.x, bot.y, bot.x + bot.w, bot.y + bot.h, 0, m.T, -1, 1);

    /* --- 主视图：位置轴 --- */
    line(ctx, aX.left, aX.Y(0), aX.right, aX.Y(0), 'rgba(255,255,255,0.8)', 1.4);
    var xt, n = 6, i;
    for (xt = 0; xt <= m.T + 1e-9; xt += m.T / n) {
      var px = aX.X(P.xOf(m, xt));
      line(ctx, px, aX.Y(0) - 5, px, aX.Y(0) + 5, '#4a4a4a', 1.2);
      txt(ctx, px, aX.Y(0) + 17, f2s(P.xOf(m, xt)), T.grey, 11.5, 'center');
    }
    txt(ctx, aX.right, aX.Y(0) + 34, 'x / m', T.grey, 11.5, 'right');
    txt(ctx, aX.left, aX.Y(0) - 26, o.motion === 'uniform' ? '匀速直线运动' : '手拉纸带（变速）', T.grey, 12, 'left');

    var tA = st.tA, tB = st.tB;
    var xA = P.xOf(m, tA), xB = P.xOf(m, tB);
    line(ctx, aT.X(tA), aX.Y(0) + 6, aT.X(tA), bot.y - 2, 'rgba(136,136,136,0.5)', 1, [4, 4]);
    line(ctx, aT.X(tB), aX.Y(0) + 6, aT.X(tB), bot.y - 2, 'rgba(136,136,136,0.5)', 1, [4, 4]);
    /* 位移 Δx（红）：位置轴上的有向线段 */
    arrow(ctx, aX.X(xA), aX.Y(0), aX.X(xB), aX.Y(0), T.red, 3.2, 11);
    dot(ctx, aX.X(xA), aX.Y(0), 6, T.white);
    dot(ctx, aX.X(xB), aX.Y(0), 6, T.white);
    txt(ctx, aX.X(xA), aX.Y(0) - 18, 'A', T.white, 13, 'center', 700);
    txt(ctx, aX.X(xB), aX.Y(0) - 18, 'B', T.white, 13, 'center', 700);
    txt(ctx, (aX.X(xA) + aX.X(xB)) / 2, aX.Y(0) + 30, 'Δx = ' + (xB - xA).toFixed(3) + ' m', T.red, 12.5, 'center', 600);
    /* 物体（当前时刻 tB 的位置） */
    glow(ctx, aX.X(xB), aX.Y(0), 5, T.yellow, 9);

    /* --- 时间轴 --- */
    line(ctx, aT.left, aT.Y(0), aT.right, aT.Y(0), 'rgba(255,255,255,0.8)', 1.4);
    var barY = aT.Y(0) - 20;
    ctx.save();
    ctx.fillStyle = 'rgba(88,196,221,0.25)';
    ctx.fillRect(aT.X(tA), barY - 7, aT.X(tB) - aT.X(tA), 14);
    ctx.restore();
    line(ctx, aT.X(tA), barY, aT.X(tB), barY, T.blue, 2.4);
    txt(ctx, (aT.X(tA) + aT.X(tB)) / 2, barY - 16, 'Δt = ' + (tB - tA).toFixed(3) + ' s', T.blue, 12.5, 'center', 600);
    ticksX(ctx, aT, m.T / 6, function (v) { return v.toFixed(2); }, aT.Y(0));
    txt(ctx, aT.right, aT.Y(0) + 34, 't / s', T.grey, 11.5, 'right');
    /* 手柄 */
    var hY = aT.Y(0);
    dot(ctx, aT.X(tA), hY, 7, T.teal); dot(ctx, aT.X(tB), hY, 7, T.teal);
    txt(ctx, aT.X(tA), hY + 19, 'A', T.white, 12, 'center', 700);
    txt(ctx, aT.X(tB), hY + 19, 'B', T.white, 12, 'center', 700);
    S.hits.push({ key: 'A', x: aT.X(tA), y: hY, r: 24 });
    S.hits.push({ key: 'B', x: aT.X(tB), y: hY, r: 24 });
    S.grab.A = function (px) { st.tA = Math.max(0, Math.min(st.tB - 0.02, aT.invX(px))); };
    S.grab.B = function (px) { st.tB = Math.min(m.T, Math.max(st.tA + 0.02, aT.invX(px))); };

    /* --- 比值定义：三个数一起看 --- */
    if (o.mode === 'ratio' && !N(W)) {
      var v = (xB - xA) / (tB - tA);
      var bx = W - 268, by = 34;
      txt(ctx, bx, by, '同一次运动，三种算法：', T.white, 12.5, 'left', 600);
      txt(ctx, bx, by + 24, '只看位移 Δx = ' + (xB - xA).toFixed(3) + ' m　（拖动就变）', T.red, 12.5, 'left');
      txt(ctx, bx, by + 46, '只看时间 Δt = ' + (tB - tA).toFixed(3) + ' s　（拖动就变）', T.blue, 12.5, 'left');
      txt(ctx, bx, by + 68, '位移 ÷ 时间 = ' + v.toFixed(2) + ' m/s　（不变）', T.yellow, 13, 'left', 700);
      frac(ctx, bx + 150, by + 108, 'Δx', 'Δt', T.yellow, 13);
      txt(ctx, bx + 176, by + 100, '= v', T.yellow, 15, 'left', 700);
    }
    if (o.mode === 'define' && !N(W)) {
      var v2 = (xB - xA) / (tB - tA);
      txt(ctx, W - 300, 34, '速度  v = Δx / Δt', T.yellow, 18, 'left', 700);
      txt(ctx, W - 300, 60, '=' + v2.toFixed(2) + ' m/s　方向与 Δx 相同', T.yellow, 12.5, 'left');
      txt(ctx, W - 300, 82, '国际单位：米每秒（m/s）', T.grey, 12.5, 'left');
      txt(ctx, W - 300, 104, '矢量：既有大小，又有方向', T.white, 12.5, 'left');
      arrow(ctx, aX.X(xA), aX.Y(0) - 40, aX.X(xB), aX.Y(0) - 40, T.yellow, 2.6, 10);
      txt(ctx, (aX.X(xA) + aX.X(xB)) / 2, aX.Y(0) - 54, 'v 的方向', T.yellow, 12.5, 'center', 600);
    }
    if (o.mode === 'avg' && !N(W)) {
      var v3 = (xB - xA) / (tB - tA);
      txt(ctx, W - 300, 34, '平均速度（一段）', T.yellow, 15, 'left', 700);
      txt(ctx, W - 300, 58, 'v̄ = Δx / Δt = ' + v3.toFixed(3) + ' m/s', T.yellow, 13, 'left');
      txt(ctx, W - 300, 80, '教材图 1.3-2：D、G 两点间 0.1 s', T.grey, 12, 'left');
    }
  }

  /* =====================================================================
     场景 3：tape —— 纸带（实验四步 / 平均速度不是速度的平均 / 选带）
     ===================================================================== */
  function drawTapeStrip(ctx, x0, y0, w, m, opt) {
    /* 纸带本体：一条白线 + 点（每 dtRaw 一个），计数点加粗 */
    opt = opt || {};
    var per = opt.per || 5, tEnd = opt.tEnd || m.T;
    var xf = function (t) { return x0 + P.xOf(m, t) / P.xOf(m, tEnd) * w; };
    line(ctx, x0, y0, x0 + w, y0, T.white, 4.5);
    var k = 0, t = 0, i = 0;
    for (t = 0; t <= tEnd + 1e-9; t += m.dtRaw) {
      var isC = (i % per === 0);
      dot(ctx, xf(t), y0, isC ? 3.4 : 2.1, isC ? T.white : T.grey, true);
      if (isC && opt.labels !== false) {
        txt(ctx, xf(t), y0 - 16, String(k), T.white, 12, 'center', 600);
        k++;
      }
      i++;
    }
    return xf;
  }
  function sceneTape(ctx, W, H, st, S) {
    var nar = N(W), o = st.opts || {}, m = P.TAPE_A, per = 5;
    var y0 = H * 0.40, x0 = nar ? 44 : 70, w = W - (nar ? 92 : 150);

    if (o.mode === 'pick') {
      /* 三条候选纸带：50 cm 内点数的硬标准（[外02]·P28：35~40 个点） */
      var cands = [
        { n: 38, ok: true,  name: '甲', note: '50 cm 内 38 个点，点迹清晰' },
        { n: 12, ok: false, name: '乙', note: '50 cm 内只有 12 个点，点迹又糊又断' },
        { n: 62, ok: false, name: '丙', note: '50 cm 内 62 个点，挤成一团' }
      ];
      for (var c = 0; c < 3; c++) {
        var yy = 104 + c * (H - 170) / 3, cc = cands[c];
        var on = (st.pick === c);
        line(ctx, x0, yy, x0 + w, yy, on ? 'rgba(255,255,0,0.55)' : 'rgba(136,136,136,0.75)', 6);
        for (var q = 0; q <= cc.n; q++) {
          var px = x0 + q / cc.n * w;
          dot(ctx, px, yy, 3.3, on ? T.yellow : T.white, true);
        }
        txt(ctx, x0 - 14, yy, cc.name, on ? T.yellow : T.white, 15, 'right', 700);
        txt(ctx, x0, yy + 20, cc.note, on ? T.yellow : T.grey, 12, 'left', on ? 600 : 400);
        S.hits.push({ key: 'pick', x: x0 + w / 2, y: yy, r: 30, val: c });
      }
      txt(ctx, x0, 40, nar ? '标准：50 cm 内清楚地记录 35~40 个点' : '标准：纸带上长约 50 cm 的范围内，清楚地记录 35~40 个点', T.white, nar ? 12 : 13, 'left', 600);
      if (!nar) { txt(ctx, x0, 62, '"完成实验操作，会选择点迹清晰的纸带" —— 最容易被忽略的一条实验能力', T.grey, 12, 'left'); }
      return;
    }

    var xf = drawTapeStrip(ctx, x0, y0, w, m, { per: per, labels: true });
    txt(ctx, x0, 40, nar ? '每 5 个点取一个计数点 → 0.1 s' :
      ((o.mode === 'avgmean') ? '同一条纸带，相邻计数点间 0.1 s' : '打点计时器每 0.02 s 打一个点；每 5 个点取一个计数点 → 0.1 s'),
      T.white, nar ? 12 : 13, 'left', 600);
    if (!nar) { txt(ctx, x0, 62, '测量的是"各计数点到起始点 0 的距离 x"，不是"相邻两点间的距离"', T.grey, 12, 'left'); }

    /* 到 0 的距离标注 */
    var sy = y0 + 62;
    for (var i = 0; i <= 6; i++) {
      var t = 0.1 * i, px = xf(t);
      line(ctx, px, y0 + 12, px, sy, 'rgba(255,255,255,0.35)', 1, [4, 4]);
      if (!nar || i % 2 === 0) { txt(ctx, px, sy + 15, P.xOf(m, t).toFixed(3), T.grey, 11.5, 'center'); }
    }
    txt(ctx, x0 - 12, sy + 15, 'x /m', T.grey, 11.5, 'right');

    /* 选中的一段 */
    var seg = st.seg || 0;
    var i1 = Math.max(0, Math.min(5, seg)), t1 = 0.1 * i1, t2 = t1 + 0.1;
    var xa = xf(t1), xb = xf(t2);
    arrow(ctx, xa, y0 - 40, xb, y0 - 40, T.red, 2.6, 9);
    txt(ctx, (xa + xb) / 2, y0 - 54, 'Δx = ' + (P.xOf(m, t2) - P.xOf(m, t1)).toFixed(3) + ' m', T.red, 12.5, 'center', 600);
    line(ctx, xa, y0 - 34, xa, y0 + 10, 'rgba(88,196,221,0.7)', 1.6, [6, 4]);
    line(ctx, xb, y0 - 34, xb, y0 + 10, 'rgba(88,196,221,0.7)', 1.6, [6, 4]);
    txt(ctx, (xa + xb) / 2, y0 + 22, 'Δt = 0.100 s', T.blue, 12.5, 'center', 600);

    if (o.mode === 'avgmean') {
      /* 迷思：把三段的速度加起来除以 3 ？
         事实：v̄ = 总位移 ÷ 总时间 */
      var v1 = P.vAvg(m, 0, 0.1), v2 = P.vAvg(m, 0.1, 0.2), v3 = P.vAvg(m, 0.2, 0.3);
      var meanOf = (v1 + v2 + v3) / 3, real = P.vAvg(m, 0, 0.3);
      var byy = H - 96;
      line(ctx, x0, byy - 26, x0 + w, byy - 26, 'rgba(255,255,255,0.18)', 1);
      var ox = nar ? 0 : 210, oy = nar ? 18 : 26, fs = nar ? 11.5 : 12.5;
      txt(ctx, x0, byy, '三段速度相加 ÷ 3：', T.grey, fs, 'left');
      txt(ctx, x0 + ox, byy + (nar ? 18 : 0), '(' + v1.toFixed(2) + ' + ' + v2.toFixed(2) + ' + ' + v3.toFixed(2) + ') ÷ 3 = ' + meanOf.toFixed(3) + ' m/s', T.red, fs, 'left', 600);
      txt(ctx, x0, byy + 2 * oy, '总位移 ÷ 总时间：', T.grey, fs, 'left');
      txt(ctx, x0 + ox, byy + 3 * oy, '0.108 ÷ 0.300 = ' + real.toFixed(3) + ' m/s', T.yellow, fs, 'left', 700);
      txt(ctx, x0, byy + 4 * oy, nar ? '两个数不一样：平均速度 = 总位移 ÷ 总时间' : '两个数不一样 —— 教材说的平均速度，永远是"总位移 ÷ 总时间"', T.white, fs, 'left');
    }
    S.hits.push({ key: 'seg0', x: xf(0.05), y: y0, r: 12, val: 0 });
    for (i = 0; i <= 5; i++) {
      (function (idx) {
        S.hits.push({ key: 'seg', x: xf(0.1 * idx + 0.05), y: y0, r: 15, val: idx });
      })(i);
    }
    S.grab.seg = function (px) {
      var tt = x0 === 0 ? 0 : 0;
      /* 由像素反算时间：x 与 t 单调，二分 40 次足够 */
      var lo = 0, hi = 0.6, mid, g;
      for (g = 0; g < 40; g++) { mid = (lo + hi) / 2; if (xf(mid) < px) { lo = mid; } else { hi = mid; } }
      st.seg = Math.max(0, Math.min(5, Math.floor(((lo + hi) / 2) / 0.1)));
    };
  }

  /* =====================================================================
     场景 4：zoom —— E 点附近（"0 ÷ 0" 与 两端收拢的极限）
     ===================================================================== */
  function sceneZoom(ctx, W, H, st, S) {
    var nar = N(W), o = st.opts || {}, m = P.TAPE_A, tE = 0.30;
    var x0 = nar ? 40 : 70, w = W - (nar ? 80 : 150), y0 = nar ? H * 0.22 : H * 0.26;
    var tEnd = 0.60;
    var xf = function (t) { return x0 + P.xOf(m, t) / P.xOf(m, tEnd) * w; };

    if (o.mode === 'zero') {
      line(ctx, x0, y0, x0 + w, y0, T.white, 4.5);
      var i, t;
      for (i = 0; i <= 30; i++) {
        t = i * 0.02;
        var isC = (i % 5 === 0);
        dot(ctx, xf(t), y0, isC ? 3.4 : 2.1, isC ? T.white : T.grey, true);
        if (isC) { txt(ctx, xf(t), y0 - 16, String(i / 5), T.white, 12, 'center', 600); }
      }
      var te = (st.tE === undefined) ? tE : st.tE;
      dot(ctx, xf(te), y0, 7, T.yellow);
      glow(ctx, xf(te), y0, 7, T.yellow, 10);
      txt(ctx, xf(te), y0 + 22, 'E', T.yellow, 15, 'center', 700);
      S.hits.push({ key: 'E', x: xf(te), y: y0, r: 24 });
      S.grab.E = function (px) {
        var lo = 0, hi = 0.6, mid, g;
        for (g = 0; g < 40; g++) { mid = (lo + hi) / 2; if (xf(mid) < px) { lo = mid; } else { hi = mid; } }
        st.tE = Math.max(0, Math.min(0.6, (lo + hi) / 2));
      };
      txt(ctx, x0, 40, '把 E 拖到纸带上的任何位置，再问一次：它上面的 Δx 和 Δt 是多少？', T.white, 13, 'left', 600);
      var bx = x0, by = H - 110;
      txt(ctx, bx, by, 'E 点上：位移 Δx 是多少？', T.white, 15, 'left', 600);
      txt(ctx, bx, by + 30, '时间是 Δt 是多少？', T.white, 15, 'left', 600);
      txt(ctx, bx + 330, by, '0', T.red, 18, 'left', 700);
      txt(ctx, bx + 330, by + 30, '0', T.blue, 18, 'left', 700);
      txt(ctx, bx, by - 26, 'E 点在 t = ' + te.toFixed(2) + ' s', T.grey, 12.5, 'left');
      txt(ctx, bx, by + 62, '0 ÷ 0 算不出来。', T.yellow, 15, 'left', 700);
      txt(ctx, bx, by + 88, '错在把物体固定在了 E 这一个点上，而不是在运动中经过 E 点。', T.white, 12.5, 'left');
      txt(ctx, bx, by + 110, '这两件事完全不一样 —— 位移和时间都是"经过"出来的。', T.grey, 12.5, 'left');
      return;
    }

    /* limit 模式：两端向 E 收拢 */
    line(ctx, x0, y0, x0 + w, y0, T.white, 4.5);
    var j, tt;
    for (j = 0; j <= 30; j++) {
      tt = j * 0.02;
      dot(ctx, xf(tt), y0, 2.1, T.grey, true);
    }
    var t1 = st.t1, t2 = st.t2;
    var x1 = P.xOf(m, t1), x2 = P.xOf(m, t2);
    /* Δx 线段（红）画在纸带上方 */
    arrow(ctx, xf(t1), y0 - 46, xf(t2), y0 - 46, T.red, 3, 10);
    line(ctx, xf(t1), y0 - 40, xf(t1), y0 + 8, 'rgba(252,98,85,0.6)', 1.4, [6, 4]);
    line(ctx, xf(t2), y0 - 40, xf(t2), y0 + 8, 'rgba(252,98,85,0.6)', 1.4, [6, 4]);

  function vtPoints() {

  }
  function sceneVT(ctx, W, H, st, S) {

      gridAxes(ctx, aM, 0.1, 0.2, 't / s', 'v / (m·s⁻¹)');

      var line1 = nar ? H * 0.56 : plot.y + 30, line2 = nar ? H * 0.66 : plot.y + 62;
      if (st.pick === 1) {
        var pp = [], i;
        for (i = 0; i <= 60; i++) { var tt = i / 60 * 0.6; pp.push([aM.X(tt), aM.Y(P.vOfB(tt))]); }
        poly(ctx, pp, T.yellow, 3);

        txt(ctx, plot.x, line2 + (nar ? 18 : 20), '与轨迹的形状无关。', T.white, nar ? 11.5 : 12.5, 'left');
        txt(ctx, plot.x, line2 + (nar ? 42 : 62), '真实轨迹：仍是一条直线', T.grey, nar ? 11.5 : 12, 'left');
        if (!nar) {

          arrow(ctx, lx + 150, ly, lx + 200, ly, T.white, 3, 9);
          dot(ctx, lx + 60, ly, 5, T.yellow);
          txt(ctx, lx, ly + 22, '真实轨迹：一条直线', T.grey, 12, 'left');
        }
      } else {
        var pq = [], j;
        for (j = 0; j <= 60; j++) { var tq = j / 60 * 0.9; pq.push([aM.X(tq), aM.Y(P.mythV(tq))]); }
        poly(ctx, pq, T.yellow, 3);
        var zx = aM.X(0.5);
        ctx.save(); ctx.fillStyle = 'rgba(252,98,85,0.12)';
        ctx.fillRect(zx, aM.Y(0), aM.right - zx, aM.Y(-0.6) - aM.Y(0)); ctx.restore();
        txt(ctx, zx + 6, aM.Y(-0.32), 'v < 0：方向反了', T.red, nar ? 11 : 12.5, 'left', 600);

        txt(ctx, plot.x, line1, '不是。', T.yellow, nar ? 16 : 18, 'left', 700);
        txt(ctx, plot.x, line2, '纵轴是速度，不是位置。负值 = 方向相反，', T.white, nar ? 11.5 : 12.5, 'left');
        txt(ctx, plot.x, line2 + (nar ? 18 : 20), '不等于减速 —— 这一段 |v| 还在变大。', T.white, nar ? 11.5 : 12.5, 'left');
      }

    var a = mkAxis(plot.x, plot.y, plot.x + plot.w, plot.y + plot.h, 0, 0.65, 0, 0.85);
    gridAxes(ctx, a, 0.1, 0.1, 't / s', 'v / (m·s⁻¹)');
    ticksX(ctx, a, 0.1, f2, a.Y(0)); ticksY(ctx, a, 0.1, f2);
    var pts = vtPoints(), i2;
    var dy = (st.bad === undefined) ? 0 : st.bad;
    var scr = pts.map(function (p, k) { return [a.X(p[0]), a.Y(p[1] + (k === 5 ? dy : 0))]; });
    if (mode === 'smooth') {
      poly(ctx, scr, T.grey, 1.8, [7, 5]);

            '<b>迷思二：</b>"这条线是弯的，说明物体在做曲线运动。"<br>' +
            '也错。v–t 图线的弯曲只说明<b>速度在变化</b>，与轨迹的形状无关（右边那条轨迹仍是直线）。',
      init: function (st) { st.pick = 0; },
      panel: function (st) {
        var k = st.pick | 0;
        if (k === 1) {
          return [
            R2('看图线', 'v–t 是曲线', 'yellow'),
            R2('说明什么', '速度在变化', 'yellow'),
            R2('能说明轨迹吗', '不能', 'red'),
            R2('真实轨迹', '仍是一条直线', 'white')
          ];
        }
        return [
          R2('t = 0.5 s 时', 'v = 0', 'white'),
          R2('t > 0.5 s', 'v < 0 → 反向运动', 'red'),
          R2('这一段的 |v|', '在变大（在加速）', 'yellow'),
          R2('所以"负值"等于', '反向，不等于减速', 'yellow')
        ];
      }
    },
    {
      act: '⑦ v–t 图像 · 5′',
      title: '够不到的 Δt = 0，用图线够到',
      scene: 'extrap', opts: {},
      allow: { pick: true },
      hint: '点底栏的 <b>全部 6 个点 / 只用前 3 个点</b> 两个按钮，看截距怎么变。',
      formula: '直线与纵轴的交点 = Δx = 0 时的速度 = 瞬时速度（理想化外推）',
      note: '以遮光片宽度 Δx 为横轴、以平均速度 v̄ 为纵轴，把点连成一条直线，' +
            '<b>延长到纵轴</b>——交点就是 Δx = 0 时的速度，也就是滑块通过光电门的瞬时速度。<br>' +
            '横轴左边那个 Δx = 0 的位置，我们<b>做不出来</b>（遮光片再薄也有厚度，纸带最小间隔也只有 0.02 s）；' +
            '但是图线够得到。这叫<b>理想化外推</b>，也是环节⑥ 开头答应你们的那个"另一种办法"。<br>' +
            '注意：外推靠的是数据范围 —— 只用最宽的三块遮光片去外推，截距会偏；' +
            '<b>可用点越靠近纵轴，外推越可靠</b>。',
      init: function (st) { st.pick = 0; },
      panel: function (st) {
        var all = (st.pick === 1) ? P.TABLE12.slice(0, 3) : P.TABLE12;
        var f = P.fitLine(all.map(function (r) { return [r.d, r.v]; }));
        var f6 = P.fitLine(P.table12Pts());
        return [
          R2('用于拟合的点数', String(all.length) + ' 个', 'white'),
          R2('拟合斜率', fx(f.k, 4), 'purple'),
          R2('截距（= 瞬时速度）', fx(f.b, 4) + ' m/s', 'yellow'),
          R2('官方给出的值', '0.410 m/s', 'white'),
          R2('相差', fx(Math.abs(f.b - P.V_A_OFFICIAL), 4) + ' m/s', 'red'),
          R2('拟合优度 r²', fx(f.r2, 4), 'grey'),
          R2('用全部 6 点时', fx(f6.b, 4) + ' m/s', 'grey')
        ];
      }
    },

    /* ---------------- 幕⑧ 小结 · 评价 · 作业（教案环节⑧） ---------------- */
    {
      act: '⑧ 小结 · 2′',
      title: '一条链带走',
      scene: 'summary', opts: {},
      allow: { pick: true },
      hint: '点一下链条上的任意一环，黄圈会停在那里。',
      formula: '一段 → 一点；比值 → 极限；测量 → 图像 → 外推',
      note: '今天只做了一件事：把"位置变化的快慢"从<b>一段</b>逼到<b>一点</b>。<br>' +
            '位移与时间之比 → <b>速度</b>（矢量，方向跟位移走）→ 只看一段是<b>平均速度</b>；' +
            'Δt 非常非常小是<b>瞬时速度</b> → 大小叫<b>速率</b> → ' +
            '怎么量？纸带上测位移和时间 → 怎么表达？v–t 图像 → ' +
            '够不到的 Δt = 0？<b>用图线截距外推</b>。<br>' +
            '下节课讲加速度 —— 注意"加速度"<b>不是</b>"速度增加"。',
      init: function (st) { st.pick = -1; },
      panel: function (st) {
        var k = st.pick | 0;
        var rows = [
          ['1 位移 ÷ 时间', 'v = Δx / Δt'],
          ['2 速度是矢量', '方向与 Δx 相同'],
          ['3 平均速度', '一段：v̄ = Δx/Δt'],
          ['4 瞬时速度', 'Δt 非常非常小'],
          ['5 速率', '瞬时速度的大小'],
          ['6 测速度', '纸带：测位移 + 测时间'],
          ['7 v–t 图像', '横轴 t、纵轴 v'],
          ['8 截距外推', '够不到的，用图线够到']
        ];
        if (k >= 0 && k < rows.length) {
          return [R2('第 ' + rows[k][0], rows[k][1], 'yellow'), R2('本课金句', '把间隔一次次缩小，', 'grey'), R2('', '不是把 Δt 真的变成 0', 'grey')];
        }
        return [
          R2('本课主线', '一段 → 一点', 'yellow'),
          R2('金句', '把间隔一次次缩小，', 'grey'),
          R2('', '不是把 Δt 真的变成 0。', 'grey'),
          R2('下节伏笔', '加速度 ≠ 速度增加', 'blue')
        ];
      }
    }
  ];

  /* ---------- 步骤机：纯重建（"上一步"永远精确复原） ---------- */
  St.apply = function (st, i) {
    if (i < 0 || i >= St.STEPS.length) { return; }
    var def = St.STEPS[i];
    /* 先复位全部交互量，再让 init 覆盖 —— 保证逐步独立 */
    var fresh = St.baseState();
    for (var k in fresh) { if (fresh.hasOwnProperty(k)) { st[k] = fresh[k]; } }
    st.step = i;
    st.act = def.act; st.title = def.title; st.hint = def.hint || '';
    st.note = def.note || ''; st.formula = def.formula || '';
    st.scene = def.scene; st.opts = def.opts || {}; st.allow = def.allow || {};
    if (def.init) { def.init(st); }
    return st;
  };

  St.keyOf = function (key) { return key; };

  window.VizSteps = St;
})();

/* =====================================================================
   viz_sp_app.js —— 交互层：翻页 / 拖动 / 滑块 / 读数 / 自检接口
   翻页用 VizSteps.apply() 纯重建，所以"上一步"永远精确复原。
   ===================================================================== */
(function () {
  'use strict';
  var P = window.VizPhys, R = window.VizRender, St = window.VizSteps;
  var cv = document.getElementById('cv');
  var st = St.baseState();
  var S = null;              // 上一帧的几何（命中测试用）
  var drag = null;

  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ---------- 底栏"选项"按钮的文案（按场景给） ---------- */
  function pickLabels(s) {
    var o = s.opts || {};
    if (s.scene === 'tape' && o.mode === 'pick') { return { lab: '纸带', list: ['甲（疏密适中）', '乙（点太稀）', '丙（点太密）'] }; }
    if (s.scene === 'dt3') { return { lab: '选段', list: ['BD 段', 'CE 段', 'DF 段'] }; }
    if (s.scene === 'vt' && o.mode === 'myth') { return { lab: '迷思', list: ['图线在横轴下方', '图线是弯的'] }; }
    if (s.scene === 'extrap') { return { lab: '拟合用点', list: ['全部 6 个点', '只用前 3 个点'] }; }
    return null;   // summary 等：只在画布上点，不在底栏出按钮
  }

  /* ================= 渲染 ================= */
  function draw() {
    S = R.render(cv, st);
    updatePanel();
    updateControls();
    markToc();
  }

  /* ================= 读数面板 ================= */
  function updatePanel() {
    var def = St.STEPS[st.step] || {};
    var rows = [];
    try { rows = def.panel ? def.panel(st) : []; } catch (e) { rows = [{ label: '读数出错', value: String(e.message), cls: 'red' }]; }
    var html = '', i;
    for (i = 0; i < rows.length; i++) {
      var r = rows[i];
      html += '<div class="rd"><span>' + (r.label || '') + '</span><b class="' + (r.cls || '') + '">' + r.value + '</b></div>';
    }
    $('rows').innerHTML = html;
    $('rdFormula').innerHTML = st.formula || '—';
    $('rdNote').innerHTML = st.note || '—';
  }

  /* ================= 底栏控件 ================= */
  function show(el, on) { if (el) { el.classList[on ? 'remove' : 'add']('hidden'); } }
  var pickBuilt = -1;

  function updateControls() {
    var a = st.allow || {};
    show($('wrapT'), !!a.t);
    show($('wrapSeg'), !!a.seg);

    var pl = a.pick ? pickLabels(st) : null;
    show($('wrapPick'), !!pl);
    if (pl) {
      if (pickBuilt !== st.step) {
        pickBuilt = st.step;
        $('pickLab').textContent = pl.lab;
        var box = $('pickBtns'), h = '';
        for (var i = 0; i < pl.list.length; i++) {
          h += '<button data-pick="' + i + '">' + pl.list[i] + '</button>';
        }
        box.innerHTML = h;
        var bs = box.querySelectorAll('button');
        for (var j = 0; j < bs.length; j++) {
          bs[j].addEventListener('click', function () {
            st.pick = parseInt(this.getAttribute('data-pick'), 10);
            draw();
          });
        }
      }
      var pb = $('pickBtns').querySelectorAll('button');
      for (var k = 0; k < pb.length; k++) {
        pb[k].className = (parseInt(pb[k].getAttribute('data-pick'), 10) === (st.pick | 0)) ? 'on' : '';
      }
    }

    $('stepTitle').textContent = st.title;
    $('actTag').textContent = String(st.act).split('·')[0].trim();
    $('stepSn').textContent = (st.step + 1) + ' / ' + St.STEPS.length;
    $('hint').innerHTML = st.hint || '';
    $('prog').firstElementChild.style.width = ((st.step + 1) / St.STEPS.length * 100) + '%';

    $('rgT').value = Math.round((st.t || 0) * 100);
    $('lbT').textContent = Math.round((st.t || 0) * 100) + '%';
    $('rgSeg').value = st.seg | 0;
    $('lbSeg').textContent = '第 ' + (st.seg | 0) + '→' + ((st.seg | 0) + 1) + ' 段';
  }

  /* ================= 翻页 ================= */
  function go(i) { if (i < 0 || i >= St.STEPS.length) { return; } St.apply(st, i); draw(); }
  function next() { go(st.step + 1); }
  function prev() { go(st.step - 1); }
  function resetStep() { go(st.step); }

  $('btnNext').addEventListener('click', next);
  $('btnPrev').addEventListener('click', prev);
  $('btnReset').addEventListener('click', resetStep);

  $('prog').addEventListener('click', function (ev) {
    var r = this.getBoundingClientRect();
    go(Math.floor(clamp((ev.clientX - r.left) / r.width, 0, 0.999) * St.STEPS.length));
  });
  (function ticks() {
    var bar = $('prog');
    for (var i = 1; i < St.STEPS.length; i++) {
      var u = document.createElement('u');
      u.style.left = (i / St.STEPS.length * 100) + '%';
      bar.appendChild(u);
    }
  })();

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowRight' || ev.key === 'PageDown') { next(); ev.preventDefault(); }
    else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { prev(); ev.preventDefault(); }
    else if (ev.key === 'Home') { go(0); ev.preventDefault(); }
    else if (ev.key === 'End') { go(St.STEPS.length - 1); ev.preventDefault(); }
  });

  /* ================= 滑块 ================= */
  $('rgT').addEventListener('input', function () { st.t = parseFloat(this.value) / 100; draw(); });
  $('rgSeg').addEventListener('input', function () { st.seg = parseInt(this.value, 10); draw(); });

  /* ================= 画布拖动 ================= */
  function evPos(ev) {
    var r = cv.getBoundingClientRect();
    var t = ev.touches ? ev.touches[0] : ev;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function hitOf(p) {
    if (!S || !S.hits) { return null; }
    var best = null, bd = 1e9, i, h, d;
    var allow = st.allow || {};
    for (i = 0; i < S.hits.length; i++) {
      h = S.hits[i];
      if (!allow[h.key]) { continue; }
      d = Math.hypot(p.x - h.x, p.y - h.y);
      if (d < h.r && d < bd) { bd = d; best = h; }
    }
    return best;
  }
  function applyHit(h, p) {
    var g = S.grab && S.grab[h.key];
    if (g) { g(p.x, p.y); return true; }
    if (h.val !== undefined) { st[h.key] = h.val; return true; }
    return false;
  }
  function onDown(ev) {
    var p = evPos(ev), h = hitOf(p);
    if (!h) { return; }
    if (applyHit(h, p)) {
      if (S.grab && S.grab[h.key]) {
        drag = { key: h.key };
        cv.style.cursor = 'grabbing';
      }
      draw();
      ev.preventDefault();
    }
  }
  function onMove(ev) {
    if (!drag) {
      var h = hitOf(evPos(ev));
      cv.style.cursor = h ? 'grab' : 'default';
      return;
    }
    var p = evPos(ev), g = S.grab && S.grab[drag.key];
    if (g) { g(p.x, p.y); draw(); }
    ev.preventDefault();
  }
  function onUp() { if (drag) { drag = null; cv.style.cursor = 'default'; } }

  cv.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  cv.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  cv.addEventListener('touchstart', onDown, { passive: false });
  cv.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);

  var rzT = null;
  window.addEventListener('resize', function () { clearTimeout(rzT); rzT = setTimeout(draw, 120); });

  /* ================= 顶部步骤导航条 ================= */
  var tocEl = $('toc'), tocLinks = [], tocMarked = -1;
  (function buildToc() {
    var curAct = null;
    for (var i = 0; i < St.STEPS.length; i++) {
      var def = St.STEPS[i];
      if (def.act !== curAct) {
        if (curAct !== null) {
          var sp = document.createElement('span'); sp.className = 'sep'; tocEl.appendChild(sp);
        }
        curAct = def.act;
        var lab = document.createElement('span');
        lab.className = 'grouplab';
        lab.textContent = String(def.act).split('·')[0].trim();
        lab.title = def.act;
        tocEl.appendChild(lab);
      }
      var a = document.createElement('a');
      a.title = (i + 1) + '. ' + def.title;
      a.textContent = String(i + 1);
      (function (idx, node) { node.addEventListener('click', function () { go(idx); }); })(i, a);
      tocEl.appendChild(a);
      tocLinks.push(a);
    }
  })();
  function markToc() {
    if (!tocLinks.length || tocMarked === st.step) { return; }
    tocMarked = st.step;
    for (var i = 0; i < tocLinks.length; i++) {
      var on = (i === st.step);
      tocLinks[i].className = on ? 'on' : '';
      if (on && tocLinks[i].scrollIntoView) { tocLinks[i].scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
    }
  }

  /* ================= 自检 / 调试接口 ================= */
  function hash() {
    var f = R.fitCanvas(cv);
    var W = Math.floor(f.W), H = Math.floor(f.H);
    var d = f.ctx.getImageData(0, 0, W, H).data;
    var h = 2166136261 >>> 0;
    for (var i = 0; i < d.length; i += 61) { h ^= d[i]; h = (h * 16777619) >>> 0; }
    return ('00000000' + h.toString(16)).slice(-8);
  }

  /** 交互一致性：每一步 allow 里的键，画面上或底栏里必须真有对应控件 */
  var FOOTER_KEYS = { t: true, seg: true, pick: true };
  function checkAllow() {
    var out = [], save = st.step, i, k;
    var backup = JSON.parse(JSON.stringify(st));
    for (i = 0; i < St.STEPS.length; i++) {
      St.apply(st, i);
      var meta = pickLabels(st) ? ['pick'] : [];
      var sc = R.render(cv, st);
      var keys = {};
      for (k = 0; k < sc.hits.length; k++) { keys[sc.hits[k].key] = true; }
      var allow = st.allow || {}, missing = [];
      for (k in allow) {
        if (!allow.hasOwnProperty(k)) { continue; }
        if (keys[k]) { continue; }
        if (FOOTER_KEYS[k] && (meta.indexOf(k) >= 0 || k === 't' || k === 'seg')) { continue; }
        missing.push(k);
      }
      /* hint ⊆ allow：提示里出现"拖动/点一下"时，allow 必须非空 */
      var hinted = /拖|点一下|点底栏|点链/.test(St.STEPS[i].hint || '');
      if (hinted && Object.keys(allow).length === 0) { missing.push('hint 说了能操作但 allow 为空'); }
      if (missing.length) { out.push({ step: i + 1, title: St.STEPS[i].title, missing: missing }); }
    }
    /* 复位 */
    for (k in backup) { if (backup.hasOwnProperty(k)) { st[k] = backup[k]; } }
    st.step = save; draw();
    return { ok: out.length === 0, bad: out, total: St.STEPS.length };
  }

  /** 前后一致性：逐步走一遍再倒着走回来，比对每一步的像素指纹 */
  function roundTrip() {
    var i, fwd = [], back = [], save = st.step;
    for (i = 0; i < St.STEPS.length; i++) { St.apply(st, i); R.render(cv, st); fwd.push(hash()); }
    for (i = St.STEPS.length - 1; i >= 0; i--) { St.apply(st, i); R.render(cv, st); }
    for (i = St.STEPS.length - 1; i >= 0; i--) { St.apply(st, i); R.render(cv, st); back[i] = hash(); }
    var bad = 0;
    for (i = 0; i < fwd.length; i++) { if (fwd[i] !== back[i]) { bad++; } }
    go(save);
    return { mismatch: bad, steps: fwd.length };
  }

  window.__viz = {
    state: st,
    count: St.STEPS.length,
    go: go, next: next, prev: prev, reset: resetStep, draw: draw,
    hash: hash,
    render: R, phys: P, steps: St,
    selfTest: function () { return P.runSelfTest(); },
    verifySpeed: function () { return P.verifySpeed(); },
    checkAllow: checkAllow,
    hits: function () { return (S && S.hits) ? S.hits.map(function (h) { return { key: h.key, x: h.x, y: h.y, r: h.r, val: h.val }; }) : []; },
    canvasRect: function () { var r = cv.getBoundingClientRect(); return { left: r.left, top: r.top, w: r.width, h: r.height }; },
    roundTrip: roundTrip,
    stepMeta: function () {
      return St.STEPS.map(function (d, i) {
        return { i: i, act: d.act, title: d.title, scene: d.scene, allow: Object.keys(d.allow || {}), hint: d.hint || '' };
      });
    }
  };

  /* ================= 启动 ================= */
  St.apply(st, 0);
  draw();
  setTimeout(draw, 60);
})();

</script>
</body>
